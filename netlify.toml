# Configuración de despliegue en Netlify
[build]
  # Optimiza imágenes, verifica (lint, formato, pruebas) y construye.
  # Si algo falla, Netlify no publica y el sitio en vivo no cambia.
  command = "npm run check && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requiere Node >= 22.12
  NODE_VERSION = "24"

# Archivos con hash en el nombre (código e imágenes): caché de 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Panel de administración: siempre la versión más reciente de la configuración
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# Cabeceras de seguridad para todo el sitio.
# La Content-Security-Policy del sitio va como <meta> (ver vite.config.ts)
# para que /admin pueda usar la suya.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
